# Fabrique les installateurs Windows (.exe) et Mac (.dmg) sur les serveurs de GitHub.
# - En poussant un tag v1.2.0, v1.3.0… : publie une « Release » publique avec les installateurs
#   (c'est aussi là que l'application vient chercher ses mises à jour).
# - Lancement manuel depuis l'onglet « Actions » : fabrique sans publier (fichiers en bas de la page du résultat).
name: Construire ThomasGotchi

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Un échec sur une plateforme n'annule pas l'autre
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # La création du .dmg échoue parfois sur les serveurs Mac de GitHub : jusqu'à 3 essais
      - shell: bash
        run: |
          for attempt in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }} && exit 0
            echo "Essai $attempt raté, nouvel essai dans 20 s"
            sleep 20
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ThomasGotchi-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
