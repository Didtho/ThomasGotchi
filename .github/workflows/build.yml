# Fabrique les installateurs Windows (.exe) et Mac (.dmg) sur les serveurs de GitHub.
# - En poussant un tag v1.2.0, v1.3.0… : publie une « Release » publique avec les installateurs
#   (c'est aussi là que l'application vient chercher ses mises à jour).
# - Lancement manuel depuis l'onglet « Actions » : fabrique sans publier (fichiers en bas de la page du résultat).
name: Construire ThomasGotchi

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Un échec sur une plateforme n'annule pas l'autre
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # La création du .dmg échoue parfois sur les serveurs Mac de GitHub : jusqu'à 3 essais
      - shell: bash
        run: |
          for attempt in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }} && exit 0
            echo "Essai $attempt raté, nouvel essai dans 20 s"
            sleep 20
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ThomasGotchi-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg

  # Envoie aussi les installateurs sur itch.io (https://didtech.itch.io/thomasgotchi), canaux « windows » et « mac ».
  # Il faut la clé d'accès itch.io dans le secret BUTLER_API_KEY du dépôt ; sans elle, cette étape ne fait rien.
  # Aussi au lancement manuel (onglet « Actions ») : renvoie la version de package.json sur itch.io.
  itch:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          path: art
      - if: env.BUTLER_API_KEY != ''
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          # Numéro de version lu dans le nom du .dmg (ThomasGotchi-2.13.2-universal.dmg)
          dmg=$(ls art/ThomasGotchi-macos-latest/*.dmg)
          version=$(basename "$dmg" | sed -E 's/^ThomasGotchi-(.+)-universal\.dmg$/\1/')
          # Un dossier par canal, avec seulement son installateur (« ThomasGotchi Setup X.exe » : sans espaces sur itch.io)
          mkdir -p up/windows up/mac
          cp art/ThomasGotchi-windows-latest/*.exe "up/windows/ThomasGotchi-Setup-$version.exe"
          cp "$dmg" up/mac/
          butler/butler push up/windows didtech/thomasgotchi:windows --userversion "$version"
          butler/butler push up/mac didtech/thomasgotchi:mac --userversion "$version"
