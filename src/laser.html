<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>Laser</title>
  <!-- Point rouge du pointeur laser : il suit la souris (main.js déplace la fenêtre), les animaux lui courent après -->
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    i {
      position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
      background: #ff2a2a; box-shadow: 0 0 6px 3px rgba(255, 40, 40, .55); animation: pulse .6s ease-in-out infinite alternate;
    }
    @keyframes pulse { to { transform: scale(1.25); box-shadow: 0 0 9px 5px rgba(255, 40, 40, .4); } }
  </style>
</head>
<body><i></i></body>
</html>
