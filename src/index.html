<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>ThomasGotchi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-cute">
  <!-- Zone du petit être (240x300). Quand une fenêtre de réglages est ouverte, la fenêtre
       s'agrandit et cette zone reste à la même place à l'écran. -->
  <div id="stage">
  <canvas id="scene" width="240" height="300"></canvas>

  <div id="bubble" class="hidden"></div>

  <!-- Panneau qui apparaît au survol : jauges + actions -->
  <div id="panel" class="hit hidden">
    <div class="title"><span id="pet-name">???</span><span id="pet-age"></span></div>
    <div class="stats">
      <div class="stat" title="Faim"><span>🍔</span><div class="bar"><i id="bar-hunger"></i></div></div>
      <div class="stat" title="Soif"><span>💧</span><div class="bar"><i id="bar-thirst"></i></div></div>
      <div class="stat" title="Énergie"><span>⚡</span><div class="bar"><i id="bar-energy"></i></div></div>
      <div class="stat" title="Bonheur"><span>💖</span><div class="bar"><i id="bar-fun"></i></div></div>
      <div class="stat" title="Propreté"><span>🧼</span><div class="bar"><i id="bar-clean"></i></div></div>
      <div class="stat" title="Santé"><span>➕</span><div class="bar"><i id="bar-health"></i></div></div>
    </div>
    <div class="actions">
      <button data-act="feed" title="Manger : glisse un fichier sur moi !">🍽️</button>
      <button data-act="drink" title="Boire">🥤</button>
      <button data-act="sleep" title="Dormir / Réveiller">🌙</button>
      <button data-act="play" title="Jouer">🎾</button>
      <button data-act="wash" title="Laver">🛁</button>
      <button data-act="heal" title="Soigner">💊</button>
      <button data-act="settings" title="Réglages">⚙️</button>
    </div>
  </div>
  </div>

  <!-- Fenêtres modales (prénom, réglages, décès) -->
  <div id="modal" class="hidden">
    <div id="modal-new" class="card hit hidden">
      <h2>Un œuf est apparu !</h2>
      <label>Son prénom
        <input id="new-name" maxlength="14" placeholder="Ex : Didou">
      </label>
      <div class="label">Mes chats</div>
      <div class="choices" id="presets"></div>
      <div class="label">Animal</div>
      <div class="choices" data-group="species">
        <button data-value="chat">🐱 Chat</button>
        <button data-value="lapin">🐰 Lapin</button>
        <button data-value="ours">🐻 Ourson</button>
      </div>
      <div class="label">Genre</div>
      <div class="choices" data-group="gender">
        <button data-value="m">♂ Il</button>
        <button data-value="f">♀ Elle</button>
      </div>
      <div class="label">Style</div>
      <div class="choices" data-group="style">
        <button data-value="cute" class="on">Mignon</button>
        <button data-value="pixel">Pixel rétro</button>
      </div>
      <div class="label">Couleur</div>
      <div class="swatches" data-group="color"></div>
      <button id="new-ok" class="primary">C'est parti !</button>
    </div>

    <div id="modal-settings" class="card hit hidden">
      <h2>Réglages</h2>
      <label>Prénom
        <input id="set-name" maxlength="14">
      </label>
      <div class="label">Animal</div>
      <div class="choices" data-group="species">
        <button data-value="chat">🐱 Chat</button>
        <button data-value="lapin">🐰 Lapin</button>
        <button data-value="ours">🐻 Ourson</button>
      </div>
      <div class="label">Genre</div>
      <div class="choices" data-group="gender">
        <button data-value="m">♂ Il</button>
        <button data-value="f">♀ Elle</button>
      </div>
      <div class="label">Style</div>
      <div class="choices" data-group="style">
        <button data-value="cute">Mignon</button>
        <button data-value="pixel">Pixel rétro</button>
      </div>
      <div class="label">Couleur</div>
      <div class="swatches" data-group="color"></div>
      <div class="label">Accessoire</div>
      <div class="choices wrap" data-group="accessory"></div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="set-sound"> Sons</label>
        <label class="check"><input type="checkbox" id="set-login"> Lancer au démarrage</label>
      </div>
      <div class="row">
        <button id="set-reset" class="danger" title="Recommencer avec un nouvel œuf (l'animal actuel rejoint les souvenirs du carnet)">🥚 Recommencer</button>
        <button id="set-quit">Quitter</button>
        <button id="set-close" class="primary">OK</button>
      </div>
      <div class="row row2">
        <button id="set-journal">📖 Carnet</button>
        <button id="set-adopt">+ Ami</button>
        <button id="set-release" class="danger">Partir</button>
      </div>
    </div>

    <div id="modal-games" class="card hit hidden">
      <h2>On joue ?</h2>
      <div class="game-list">
        <button data-game="ball">🎾 Lancer la balle</button>
        <button data-game="catch">🍪 Attrape les friandises</button>
        <button data-game="cups">🥤 Le jeu des gobelets</button>
      </div>
      <button class="close-modal">Fermer</button>
    </div>

    <div id="modal-catch" class="card hit hidden">
      <h2>Attrape ! <span id="catch-score" class="score">0</span><span id="catch-time" class="time"></span></h2>
      <div id="catch-area"><div id="catcher"></div></div>
      <p id="catch-msg" class="hint">Bouge la souris pour attraper les friandises. Évite les 💩 !</p>
      <div class="row"><button id="catch-again" class="primary hidden">Rejouer</button><button class="close-modal">Fermer</button></div>
    </div>

    <div id="modal-cups" class="card hit hidden">
      <h2 id="cups-title">Où est-il caché ?</h2>
      <div id="cups-area"></div>
      <p id="cups-msg" class="hint">Regarde bien sous quel gobelet il se cache…</p>
      <div class="row"><button id="cups-again" class="primary hidden">Rejouer</button><button class="close-modal">Fermer</button></div>
    </div>

    <div id="modal-journal" class="card hit hidden">
      <h2 id="journal-title">Carnet</h2>
      <div id="journal-body"></div>
      <button class="close-modal primary">Fermer</button>
    </div>

    <div id="modal-dead" class="card hit hidden">
      <h2>Oh non…</h2>
      <p id="dead-text"></p>
      <button id="dead-ok" class="primary">Faire éclore un nouvel œuf</button>
    </div>
  </div>

  <script src="pet.js"></script>
  <script src="draw.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>
  <script src="games.js"></script>
</body>
</html>
