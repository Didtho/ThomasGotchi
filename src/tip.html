<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Aide</title>
  <!-- Bulle d'aide au survol d'un meuble (gamelle, panier, plante) : main.js la place au-dessus et donne le texte -->
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    body { display: flex; align-items: flex-end; justify-content: center; }
    span {
      max-width: calc(100% - 8px); margin-bottom: 2px; padding: 4px 9px; box-sizing: border-box;
      font: 600 12px 'Segoe UI', system-ui, -apple-system, sans-serif; color: #3b2a3a; text-align: center;
      background: #fffaf3; border: 1.5px solid #3b2a3a; border-radius: 10px; box-shadow: 0 2px 0 rgba(59, 42, 58, .25);
    }
  </style>
</head>
<body>
  <span id="t"></span>
  <script>document.getElementById('t').textContent = new URLSearchParams(location.search).get('text') || '';</script>
</body>
</html>
